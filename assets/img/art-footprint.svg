<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="IPC land pattern drawing with pads, courtyard and dimension callouts">
  <defs>
    <pattern id="fgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fpad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5B078"/><stop offset="1" stop-color="#BC7B44"/>
    </linearGradient>
  </defs>
  <rect width="640" height="460" fill="#0C1220"/>
  <rect width="640" height="460" fill="url(#fgrid)"/>

  <!-- courtyard -->
  <rect x="150" y="132" width="340" height="240" rx="10" fill="none" stroke="#2C53FF" stroke-width="1.6" stroke-dasharray="7 7" stroke-opacity=".85"/>
  <text x="150" y="124" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#7D93FF">COURTYARD · 0.25 mm EXCESS</text>

  <!-- body outline -->
  <rect x="196" y="172" width="248" height="160" rx="6" fill="#101A24" stroke="#3B4C5E"/>
  <rect x="214" y="190" width="212" height="124" rx="4" fill="none" stroke="#25313F" stroke-dasharray="3 5"/>
  <text x="252" y="250" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#6E7F91">QFN-32 · 5 × 5 mm</text>
  <text x="252" y="268" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" fill="#4F6070">0.50 mm PITCH</text>

  <!-- pins -->
  <g fill="url(#fpad)">
    <rect x="206" y="152" width="14" height="40" rx="3"/><rect x="226" y="152" width="14" height="40" rx="3"/>
    <rect x="246" y="152" width="14" height="40" rx="3"/><rect x="266" y="152" width="14" height="40" rx="3"/>
    <rect x="286" y="152" width="14" height="40" rx="3"/><rect x="306" y="152" width="14" height="40" rx="3"/>
    <rect x="326" y="152" width="14" height="40" rx="3"/><rect x="346" y="152" width="14" height="40" rx="3"/>
    <rect x="226" y="312" width="14" height="40" rx="3"/><rect x="246" y="312" width="14" height="40" rx="3"/>
    <rect x="266" y="312" width="14" height="40" rx="3"/><rect x="286" y="312" width="14" height="40" rx="3"/>
    <rect x="306" y="312" width="14" height="40" rx="3"/><rect x="326" y="312" width="14" height="40" rx="3"/>
    <rect x="346" y="312" width="14" height="40" rx="3"/><rect x="366" y="312" width="14" height="40" rx="3"/>
    <rect x="176" y="192" width="40" height="14" rx="3"/><rect x="176" y="212" width="40" height="14" rx="3"/>
    <rect x="176" y="232" width="40" height="14" rx="3"/><rect x="176" y="252" width="40" height="14" rx="3"/>
    <rect x="176" y="272" width="40" height="14" rx="3"/><rect x="176" y="292" width="40" height="14" rx="3"/>
    <rect x="424" y="192" width="40" height="14" rx="3"/><rect x="424" y="212" width="40" height="14" rx="3"/>
    <rect x="424" y="232" width="40" height="14" rx="3"/><rect x="424" y="252" width="40" height="14" rx="3"/>
    <rect x="424" y="272" width="40" height="14" rx="3"/><rect x="424" y="292" width="40" height="14" rx="3"/>
  </g>

  <!-- thermal pad -->
  <rect x="266" y="206" width="108" height="92" rx="4" fill="url(#fpad)" fill-opacity=".16" stroke="#D79A62" stroke-width="1.4" stroke-dasharray="4 4"/>
  <g fill="#C58A54" fill-opacity=".55">
    <circle cx="286" cy="226" r="2.4"/><circle cx="306" cy="226" r="2.4"/><circle cx="326" cy="226" r="2.4"/><circle cx="346" cy="226" r="2.4"/>
    <circle cx="286" cy="252" r="2.4"/><circle cx="306" cy="252" r="2.4"/><circle cx="326" cy="252" r="2.4"/><circle cx="346" cy="252" r="2.4"/>
    <circle cx="286" cy="278" r="2.4"/><circle cx="306" cy="278" r="2.4"/><circle cx="326" cy="278" r="2.4"/><circle cx="346" cy="278" r="2.4"/>
  </g>

  <!-- pins 1 marker -->
  <circle cx="185" cy="181" r="7" fill="none" stroke="#FFFFFF" stroke-opacity=".5"/>
  <text x="181" y="184.5" font-family="JetBrains Mono, monospace" font-size="8" fill="#FFFFFF">1</text>

  <!-- dimension lines -->
  <g stroke="#5A6B7C" stroke-width="1" fill="none">
    <path d="M150 402h340M150 396v12M490 396v12"/>
    <path d="M108 132v240M102 132h12M102 372h12"/>
  </g>
  <g fill="#8FA0B1" font-family="JetBrains Mono, monospace" font-size="9">
    <text x="286" y="420">9.60 mm</text>
    <text x="34" y="258" transform="rotate(-90 34 258)">7.40 mm</text>
  </g>

  <!-- callouts -->
  <g font-family="JetBrains Mono, monospace" font-size="9">
    <path d="M544 176h-26" stroke="#5A6B7C"/>
    <text x="550" y="179" fill="#8FA0B1">SOLDER MASK</text>
    <path d="M544 200h-26" stroke="#5A6B7C"/>
    <text x="550" y="203" fill="#8FA0B1">PASTE 1:1</text>
    <path d="M544 224h-26" stroke="#5A6B7C"/>
    <text x="550" y="227" fill="#8FA0B1">ANNULAR 0.05</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#4E6070">
    <text x="34" y="42">LAND PATTERN / TOP VIEW</text>
    <text x="492" y="438">REV C</text>
  </g>
  <g fill="#2C53FF"><rect x="34" y="54" width="22" height="3" rx="1.5"/></g>
</svg>
