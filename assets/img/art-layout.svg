<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="PCB layout with routed traces, plane pours and component placement outlines">
  <defs>
    <linearGradient id="layg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3A2E"/><stop offset="1" stop-color="#08201A"/>
    </linearGradient>
    <pattern id="laydots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".9" fill="#FFF" fill-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="640" height="460" fill="#0A1018"/>
  <g transform="rotate(-3 320 230)">
    <rect x="56" y="52" width="528" height="356" rx="16" fill="url(#layg)" stroke="#28705A"/>
    <rect x="56" y="52" width="528" height="356" rx="16" fill="url(#laydots)"/>

    <!-- copper pour hatching -->
    <g stroke="#C0763E" stroke-opacity=".18" stroke-width="1">
      <path d="M76 76h488M76 96h488M76 116h488M76 136h488M76 156h488M76 176h488M76 196h488M76 216h488M76 236h488M76 256h488M76 276h488M76 296h488M76 316h488M76 336h488M76 356h488M76 376h488"/>
    </g>

    <!-- traces -->
    <g fill="none" stroke="#D79A62" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9">
      <path d="M120 110h60v40h90" stroke-width="3"/>
      <path d="M120 128h44v56h60" stroke-width="2.4"/>
      <path d="M410 120h70v60" stroke-width="3"/>
      <path d="M470 110h-40v30h-60" stroke-width="2.4"/>
      <path d="M150 340h80v-40h70" stroke-width="3"/>
      <path d="M470 330h-70v-34h-60" stroke-width="2.4"/>
      <path d="M300 96v40" stroke-width="2.4"/>
      <path d="M330 322v40" stroke-width="2.4"/>
      <path d="M90 240h50v44" stroke-width="2.4"/>
      <path d="M500 220h-50v-40" stroke-width="2.4"/>
    </g>

    <!-- plane split -->
    <path d="M330 76v60M330 180v40M330 264v64" stroke="#5E7391" stroke-width="1" stroke-dasharray="5 6" fill="none"/>

    <!-- components -->
    <g stroke="#7F9A8E" fill="#132A22">
      <rect x="200" y="150" width="120" height="86" rx="6"/>
      <rect x="368" y="188" width="74" height="74" rx="5"/>
    </g>
    <g stroke="#D9A066" stroke-width="4" stroke-dasharray="5 9">
      <line x1="208" y1="147" x2="312" y2="147"/>
      <line x1="208" y1="239" x2="312" y2="239"/>
      <line x1="197" y1="160" x2="197" y2="226"/>
      <line x1="323" y1="160" x2="323" y2="226"/>
    </g>
    <g fill="url(#laydots)">
      <circle cx="406" cy="226" r="3" fill="#E0A870"/>
    </g>
    <g fill="#D9A066">
      <circle cx="382" cy="202" r="2.6"/><circle cx="396" cy="202" r="2.6"/><circle cx="410" cy="202" r="2.6"/><circle cx="424" cy="202" r="2.6"/>
      <circle cx="382" cy="216" r="2.6"/><circle cx="396" cy="216" r="2.6"/><circle cx="410" cy="216" r="2.6"/><circle cx="424" cy="216" r="2.6"/>
      <circle cx="382" cy="230" r="2.6"/><circle cx="396" cy="230" r="2.6"/><circle cx="410" cy="230" r="2.6"/><circle cx="424" cy="230" r="2.6"/>
      <circle cx="382" cy="244" r="2.6"/><circle cx="396" cy="244" r="2.6"/><circle cx="410" cy="244" r="2.6"/><circle cx="424" cy="244" r="2.6"/>
    </g>

    <g fill="#132A22" stroke="#7F9A8E">
      <rect x="106" y="300" width="34" height="20" rx="2"/>
      <rect x="452" y="86" width="46" height="26" rx="2"/>
      <rect x="464" y="300" width="26" height="26" rx="2"/>
    </g>

    <!-- silkscreen -->
    <g fill="#E9E7DF" opacity=".65" font-family="JetBrains Mono, monospace" font-size="7.5">
      <text x="204" y="272">U1</text>
      <text x="370" y="280">U4</text>
      <text x="106" y="334">L2</text>
      <text x="452" y="76">J3</text>
      <text x="380" y="86">PWR · 3V3</text>
    </g>

    <!-- mounting holes -->
    <g fill="#081812" stroke="#2E745D">
      <circle cx="86" cy="82" r="9"/><circle cx="554" cy="82" r="9"/>
      <circle cx="86" cy="378" r="9"/><circle cx="554" cy="378" r="9"/>
    </g>

    <!-- dimension -->
    <g stroke="#8FA0B1" stroke-width="1" fill="none" stroke-opacity=".6">
      <path d="M56 426h528M56 420v12M584 420v12"/>
    </g>
    <text x="292" y="442" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#8FA0B1">86.0 mm</text>
  </g>
</svg>
